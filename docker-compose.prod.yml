# Compose de production, transfere sur le VPS par deploy.yml (ADR-0004).
#
# Routage (ADR-0003, ADR-0009) : Traefik est le seul service qui publie des
# ports. Il termine le TLS avec le certificat Cloudflare Origin CA et route
# par nom d'hote :
#   - ${DOMAIN} (et www.)  -> site      (vitrine statique)
#   - app.${DOMAIN}        -> frontend  (SPA + proxy /api vers le backend)
# api.${DOMAIN} et mcp.${DOMAIN} sont reserves aux futurs outils.
#
# Prerequis sur le VPS (hors depot) : ${APP_DIR}/certs/origin.pem et
# ${APP_DIR}/certs/origin.key (voir traefik/dynamic/tls.yml).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    # Majeure epinglee : les correctifs v3 (dont la compatibilite avec les
    # versions recentes de l'API Docker) sont recuperes a chaque deploiement.
    image: traefik:v3
    container_name: caixadev_traefik
    restart: always
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=caixadev_web
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Sur tout le HTTPS : origine reservee a Cloudflare, en-tetes de
      # securite (traefik/dynamic/security.yml, T38/T39).
      - --entrypoints.websecure.http.middlewares=cloudflare-only@file,security-headers@file
      # Dashboard prive : servi sur l'entrypoint interne "traefik" (:8080),
      # publie uniquement sur 127.0.0.1 du VPS. Acces par tunnel SSH :
      #   ssh -L 8080:127.0.0.1:8080 <vps>  puis  http://localhost:8080/
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - web
    logging: *default-logging

  site:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/site:${IMAGE_TAG:-latest}
    container_name: caixadev_site
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`${DOMAIN:-caixadev.dev}`) || Host(`www.${DOMAIN:-caixadev.dev}`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.middlewares=www-to-apex,csp-site@file
      - traefik.http.middlewares.www-to-apex.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.www-to-apex.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.www-to-apex.redirectregex.permanent=true
      - traefik.http.services.site.loadbalancer.server.port=80
    # T12 : nginx sert la page d'accueil (wget de busybox, inclus dans l'image).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - web
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: caixadev_postgres
    restart: always
    environment:
      POSTGRES_DB: caixadev
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caixanet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Sauvegarde PostgreSQL (T17) : pg_dump au demarrage puis toutes les 24 h,
  # retention 14 jours, dans ${APP_DIR}/backups (hors volume de la base).
  # Restauration et verification : voir scripts/backup/pg-backup.sh.
  backup:
    image: postgres:16-alpine
    container_name: caixadev_backup
    restart: always
    entrypoint: ["/bin/sh", "/opt/backup/pg-backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGDATABASE: caixadev
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_INTERVAL_SECONDS: "86400"
    volumes:
      - ./scripts/backup:/opt/backup:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caixanet
    logging: *default-logging

  backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/backend:${IMAGE_TAG:-latest}
    container_name: caixadev_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/caixadev
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://app.${DOMAIN:-caixadev.dev}
    # T12 : pret a servir, connexion a la base comprise (Actuator, statut
    # seul). start_period couvre le demarrage de Spring et les migrations.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s
    # API machine des outils (ADR-0009, ADR-0010) : seul le prefixe de l'outil
    # est routable sur api.<domaine>. /api/** (plateforme) et /actuator/**
    # restent inaccessibles par ce domaine. Authentification par cle d'API
    # dans le backend ; limitation de debit dans Traefik.
    labels:
      - traefik.enable=true
      - traefik.http.routers.cvc-gaines.rule=Host(`api.${DOMAIN:-caixadev.dev}`) && PathPrefix(`/cvc-gaines/`)
      - traefik.http.routers.cvc-gaines.entrypoints=websecure
      - traefik.http.routers.cvc-gaines.middlewares=api-ratelimit@file,csp-api@file
      - traefik.http.routers.cvc-gaines.service=cvc-gaines
      - traefik.http.services.cvc-gaines.loadbalancer.server.port=8080
      # Serveur MCP (T25) : https://mcp.<domaine>/cvc-gaines, reecrit vers le
      # servlet MCP du backend (/cvc-gaines/mcp), protege par la meme cle d'API.
      - traefik.http.routers.cvc-gaines-mcp.rule=Host(`mcp.${DOMAIN:-caixadev.dev}`) && Path(`/cvc-gaines`)
      - traefik.http.routers.cvc-gaines-mcp.entrypoints=websecure
      - traefik.http.routers.cvc-gaines-mcp.middlewares=cvc-gaines-mcp-path,api-ratelimit@file,csp-api@file
      - traefik.http.routers.cvc-gaines-mcp.service=cvc-gaines
      - traefik.http.middlewares.cvc-gaines-mcp-path.replacepath.path=/cvc-gaines/mcp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # web : uniquement pour etre joint par Traefik (routeur ci-dessus).
      - web
      - caixanet
    logging: *default-logging

  frontend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}/frontend:${IMAGE_TAG:-latest}
    container_name: caixadev_frontend
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.${DOMAIN:-caixadev.dev}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.middlewares=csp-app@file
      - traefik.http.routers.app.service=app
      # Connexion : meme service, limitee en debit (T38). Priorite explicite
      # pour l'emporter sur le routeur general de app.
      - traefik.http.routers.app-login.rule=Host(`app.${DOMAIN:-caixadev.dev}`) && Path(`/api/auth/login`)
      - traefik.http.routers.app-login.entrypoints=websecure
      - traefik.http.routers.app-login.priority=100
      - traefik.http.routers.app-login.middlewares=login-ratelimit@file,csp-app@file
      - traefik.http.routers.app-login.service=app
      - traefik.http.services.app.loadbalancer.server.port=80
    # T12 : nginx sert la SPA (la sante du backend a son propre healthcheck).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
      - caixanet
    logging: *default-logging

volumes:
  postgres_data:

networks:
  # Reseau expose a Traefik : uniquement les services routes publiquement.
  web:
    name: caixadev_web
  # Reseau interne applicatif : backend et base ne sont jamais vus par Traefik.
  caixanet:
