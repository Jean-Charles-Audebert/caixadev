app:
  super-admin:
    # Aucune valeur par défaut : le superadministrateur n'est créé que si
    # SUPER_ADMIN_EMAIL et SUPER_ADMIN_PASSWORD sont fournis par l'environnement.
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}

spring:
  # Aucun profil n'est activé par défaut : SPRING_PROFILES_ACTIVE doit être
  # défini explicitement (dev, test ou prod). Voir StartupSecurityValidator.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# Sante (T12) : seul l'endpoint health est expose, sans aucun detail
# (versions, base, disque). Il sert au healthcheck Docker et n'est pas
# joignable depuis Internet : le nginx du frontend ne relaie que /api/.
#   /actuator/health/liveness  : le processus repond
#   /actuator/health/readiness : pret a servir, base de donnees comprise
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

# Contrat OpenAPI des outils (cvc-gaines) : uniquement leurs routes, publie
# sous le prefixe de l'outil donc protege par la cle d'API. Aucune interface
# Swagger UI n'est embarquee.
springdoc:
  api-docs:
    path: /cvc-gaines/v1/openapi.json
  paths-to-match: /cvc-gaines/v1/**
  packages-to-scan: dev.caixadev.tools.cvcgaines.api

jwt:
  # Aucune valeur par défaut : le secret doit venir de l'environnement.
  # Les profils dev et test définissent une valeur locale explicite.
  secret: ${JWT_SECRET:}
  access-token-expiration-ms: 900000      # 15 minutes
  refresh-token-expiration-days: 7
  reset-token-expiration-ms: 3600000      # 1 hour
