app:
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:jc1932@gmail.com}
    password: ${SUPER_ADMIN_PASSWORD:}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/caixadev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-dev-only-32chars}
  access-token-expiration-ms: 900000      # 15 minutes
  refresh-token-expiration-days: 7
  reset-token-expiration-ms: 3600000      # 1 hour
