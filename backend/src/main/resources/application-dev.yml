spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/caixadev
    username: postgres
    password: postgres

  flyway:
    # Les données de démonstration (projet 'test', rôles de projet) ne sont
    # chargées qu'en développement.
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG

cors:
  allowed-origins: "http://localhost:5173"

jwt:
  # Valeur locale uniquement, refusée en production.
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-32chars}
