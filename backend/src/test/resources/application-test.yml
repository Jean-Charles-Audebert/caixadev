# Profil "test" - utilisé par les tests automatisés (local et CI).
# La connexion PostgreSQL est fournie par variables d'environnement.
# En CI : service postgres sur localhost:5432, base caixadev_test (cf. .github/workflows/ci.yml).
# En local : surcharger DB_URL pour viser l'instance locale (ex. port 5433).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/caixadev_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  flyway:
    # Aucun seed de démonstration : même périmètre de migrations qu'en production.
    # Aucun ignore-migration-patterns : Flyway n'accepte que des types
    # (`versioned`, `repeatable`, `*`) et `*:missing` masquerait une migration
    # réellement absente. Cf. commentaire de application-prod.yml.
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:test-only-jwt-secret-at-least-32-characters}
