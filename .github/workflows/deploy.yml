name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.image_prefix.outputs.value }}

    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image prefix
        id: image_prefix
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="${REGISTRY}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "$prefix" | grep -q '[A-Z]'; then
            echo "::error::Image prefix contains uppercase characters: $prefix"
            exit 1
          fi
          echo "value=$prefix" >> "$GITHUB_OUTPUT"
          echo "Image prefix: $prefix"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image_prefix.outputs.value }}/backend:latest
            ${{ steps.image_prefix.outputs.value }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.image_prefix.outputs.value }}/frontend:latest
            ${{ steps.image_prefix.outputs.value }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-26.04
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/caixadev
            export IMAGE_PREFIX="${{ needs.build-and-push.outputs.image_prefix }}"
            export IMAGE_TAG=${{ github.sha }}
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export JWT_SECRET=${{ secrets.JWT_SECRET }}

            case "$IMAGE_PREFIX" in
              *[A-Z]*)
                echo "IMAGE_PREFIX must be lowercase, got: $IMAGE_PREFIX" >&2
                exit 1
                ;;
            esac

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
