name: Deploy

on:
  push:
    branches: [main]

# Un seul deploiement a la fois : deux push rapproches sur main ne doivent pas
# se chevaucher sur le VPS. cancel-in-progress: false => le second attend que
# le premier se termine (aucun deploiement interrompu a mi-parcours).
# Meme groupe que rollback.yml : un rollback attend un deploiement en cours.
# (Pas de concurrency dans deploy-vps.yml : un workflow appele qui reprend le
# groupe de son appelant se bloque lui-meme.)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # D01 / T47 : aucune image n'est publiee ni deployee si la CI echoue sur ce
  # commit. L'image backend etant construite avec -DskipTests, ce sont ces
  # tests qui font foi.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-26.04
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      # Un secret manquant doit bloquer AVANT toute publication d'image.
      # Les valeurs ne sont jamais ecrites : seuls les noms sont affiches.
      - name: Preflight - required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
        run: |
          set -euo pipefail
          missing=""
          for name in VPS_HOST VPS_USER SSH_PRIVATE_KEY DB_USERNAME DB_PASSWORD \
                      JWT_SECRET SUPER_ADMIN_EMAIL SUPER_ADMIN_PASSWORD                       VPS_SSH_FINGERPRINT; do
            if [ -z "$(printenv "$name" || true)" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Secrets obligatoires absents ou vides:${missing}"
            exit 1
          fi
          # Meme minimum que StartupSecurityValidator (32 octets) : on echoue
          # ici plutot que de laisser le conteneur backend refuser de demarrer.
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET doit contenir au moins 32 caracteres."
            exit 1
          fi
          echo "Preflight OK : secrets obligatoires presents."

      - uses: actions/checkout@v7

      - name: Compute lowercase image prefix
        id: image_prefix
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="${REGISTRY}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "$prefix" | grep -q '[A-Z]'; then
            echo "::error::Image prefix contains uppercase characters: $prefix"
            exit 1
          fi
          echo "value=$prefix" >> "$GITHUB_OUTPUT"
          echo "Image prefix: $prefix"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image_prefix.outputs.value }}/backend:latest
            ${{ steps.image_prefix.outputs.value }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.image_prefix.outputs.value }}/frontend:latest
            ${{ steps.image_prefix.outputs.value }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push site
        uses: docker/build-push-action@v7
        with:
          context: site
          push: true
          tags: |
            ${{ steps.image_prefix.outputs.value }}/site:latest
            ${{ steps.image_prefix.outputs.value }}/site:${{ github.sha }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

  # Le deploiement lui-meme est partage avec le rollback (T18) : meme script,
  # memes garde-fous. Voir deploy-vps.yml.
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    uses: ./.github/workflows/deploy-vps.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: read
