name: CI

# Sur `main`, la CI n'est pas déclenchée directement par `push` : elle est
# appelée par `deploy.yml` (workflow_call), qui ne publie et ne déploie que si
# elle réussit (constat D01 / T47). Les PR vers `main` restent vérifiées ici.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caixadev_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test
        run: ./mvnw verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/caixadev_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long

  frontend:
    name: Frontend — Build & Lint
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker — Build images (no push)
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # cache-to uniquement sur push : les caches écrits depuis une PR sont
      # scopés sur la ref de la PR et ne sont jamais réutilisés (quota gaspillé).
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: caixadev-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Verify backend image
        run: docker image inspect caixadev-backend:ci > /dev/null

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          load: true
          tags: caixadev-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Verify frontend image
        run: docker image inspect caixadev-frontend:ci > /dev/null
